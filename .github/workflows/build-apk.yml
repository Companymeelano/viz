# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK (debug + release)
#  Developed by Milano Technical Team, Milad Yaghoobi
#  ─────────────────────────────────────────────────────────────────────────
#  مراحل:
#   ۱) بیلد debug  → آپلود آرتیفکت (همیشه نصب‌شدنی برای تست)
#   ۲) بیلد release → آپلود آرتیفکت (R8 فعال)
#  در صورت خطا، خلاصهٔ خطاهای Gradle به‌صورت Annotation منتشر می‌شود تا بدون
#  دانلود لاگ، علت شکست قابل مشاهده باشد.
#  لاگ بیلد فقط به‌صورت Artifact آپلود می‌شود و هرگز در مخزن کامیت نمی‌شود.
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, arena/01a0a879-viz]
    paths-ignore:
      - '**.md'
      - 'design/**'
      - '**.zip'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Toolchain info
        run: |
          java -version
          gradle --version

      # ── ۱) APK دیباگ (همیشه ساخته می‌شود و نصب‌شدنی است) ────────────────
      - name: Build debug APK
        id: build_debug
        run: |
          set +e
          gradle clean assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build-debug.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "report_debug_failed=1" >> "$GITHUB_ENV"
            ./scripts/report-gradle-errors.sh build-debug.log "debug"
          fi
          exit "$rc"

      - name: Collect debug APK
        if: success()
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v${VERSION}-debug.apk"
          ls -la dist/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-${{ env.VERSION }}-debug
          path: dist/Vizitor-${{ env.VERSION }}-debug.apk
          if-no-files-found: error

      # ── ۲) APK ریلیز (R8/minify) — شکست آن، آرتیفکت دیباگ را باطل نمی‌کند ─
      - name: Build release APK
        id: build_release
        if: success()
        continue-on-error: true
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build-release.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "report_release_failed=1" >> "$GITHUB_ENV"
            ./scripts/report-gradle-errors.sh build-release.log "release"
          fi
          exit "$rc"

      - name: Collect and upload release APK
        if: steps.build_release.outcome == 'success'
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "dist/Vizitor-v${VERSION}-release.apk"
          ls -la dist/
          echo "release_ok=1" >> "$GITHUB_ENV"

      - name: Upload release APK
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-${{ env.VERSION }}-release
          path: dist/Vizitor-${{ env.VERSION }}-release.apk
          if-no-files-found: error

      # ── خلاصهٔ نتیجه ────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          {
            echo "## نتیجهٔ بیلد Vizitor"
            echo ""
            if [ "${report_debug_failed:-0}" = "1" ]; then
              echo "- ❌ بیلد **debug** ناموفق بود (خطاها در Annotation بالای همین Job)"
            else
              echo "- ✅ بیلد **debug** موفق — آرتیفکت: \`Vizitor-v${VERSION:-?}-debug.apk\`"
            fi
            if [ "${report_release_failed:-0}" = "1" ]; then
              echo "- ❌ بیلد **release** ناموفق بود (خطاها در Annotation)"
            elif [ "${release_ok:-0}" = "1" ]; then
              echo "- ✅ بیلد **release** موفق — آرتیفکت: \`Vizitor-v${VERSION}-release.apk\`"
            else
              echo "- ⏭️ بیلد **release** اجرا نشد (وابسته به موفقیت debug)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs (فقط در صورت خطا)
        if: failure() || env.report_release_failed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-debug.log
            build-release.log
          if-no-files-found: ignore
